org.gradle.jvmargs=-Xmx4g -XX:MetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Explizit JDK 17 erzwingen — verhindert Build-Fehler wenn der System-Java-Pfad
# auf eine ältere Version (z. B. Java 8 via jenv) zeigt.
# Anpassen falls JDK 17 an einem anderen Ort installiert ist.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

android.useAndroidX=true

kotlin.code.style=official
kotlin.incremental=true
